name: Task 06 API tests

on:
  push:
    paths:
      - "RabTech_Task06_Prediction_API/**"
      - "RabTech_Task03_Deliverables/clean_dataset.csv"
      - ".github/workflows/task06-api-tests.yml"
  pull_request:
    paths:
      - "RabTech_Task06_Prediction_API/**"
      - "RabTech_Task03_Deliverables/clean_dataset.csv"
      - ".github/workflows/task06-api-tests.yml"
  workflow_dispatch:

jobs:
  test-api:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: RabTech_Task06_Prediction_API/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r RabTech_Task06_Prediction_API/requirements.txt

      - name: Run API tests
        working-directory: RabTech_Task06_Prediction_API
        run: pytest -q

      - name: Build Docker image
        run: docker build -f RabTech_Task06_Prediction_API/Dockerfile -t rabtech-task06-api .
