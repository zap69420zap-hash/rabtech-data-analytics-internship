name: Task 05 dashboard evidence

on:
  push:
    paths:
      - ".github/workflows/task05-dashboard-evidence.yml"
      - "RabTech_Task05_Interactive_Dashboard/**"
      - "RabTech_Task03_Deliverables/clean_dataset.csv"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dashboard and browser dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r RabTech_Task05_Interactive_Dashboard/requirements.txt playwright
          python -m playwright install --with-deps chromium

      - name: Launch Streamlit dashboard
        run: |
          cd RabTech_Task05_Interactive_Dashboard
          nohup streamlit run app.py --server.headless true --server.port 8501 > /tmp/streamlit.log 2>&1 &
          echo $! > /tmp/streamlit.pid

      - name: Capture dashboard screenshots
        run: |
          mkdir -p RabTech_Task05_Interactive_Dashboard/evidence
          cat > /tmp/capture_dashboard.py <<'PY'
          import asyncio
          from pathlib import Path
          from playwright.async_api import async_playwright

          async def main():
              async with async_playwright() as p:
                  browser = await p.chromium.launch()
                  page = await browser.new_page(viewport={"width": 1600, "height": 1100}, device_scale_factor=1)
                  await page.goto("http://127.0.0.1:8501", wait_until="domcontentloaded", timeout=120000)
                  await page.wait_for_selector("text=Retail Performance Dashboard", timeout=120000)
                  await page.wait_for_timeout(10000)
                  out = Path("RabTech_Task05_Interactive_Dashboard/evidence")
                  await page.screenshot(path=str(out / "dashboard_overview.png"), full_page=True)
                  await page.screenshot(path=str(out / "dashboard_top.png"), full_page=False)
                  await browser.close()

          asyncio.run(main())
          PY
          python /tmp/capture_dashboard.py

      - name: Commit screenshots to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add RabTech_Task05_Interactive_Dashboard/evidence/dashboard_overview.png RabTech_Task05_Interactive_Dashboard/evidence/dashboard_top.png
          if git diff --cached --quiet; then
            echo "No screenshot changes to commit."
          else
            git commit -m "Add Task 05 dashboard screenshot evidence"
            git push
          fi
